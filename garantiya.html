<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гарантийный талон · Handyman Грозный</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ece8df">
<link rel="icon" href="/icons/site-192.png">
<link rel="apple-touch-icon" href="/icons/site-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#ece8df;--ink:#1d2a44;--ink2:#55607a;--line:rgba(29,42,68,.18);--yellow:#ffd400;--red:#d6281c;--green:#1f8a4c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding:28px 16px 60px;
  background-image:linear-gradient(rgba(29,42,68,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(29,42,68,.06) 1px,transparent 1px);background-size:24px 24px}
a{color:inherit}
.t{max-width:640px;margin:0 auto;background:var(--paper);border:2.5px solid var(--ink);box-shadow:10px 10px 0 var(--yellow),10px 10px 0 2.5px var(--ink);position:relative;overflow:hidden}
.haz{height:14px;background:repeating-linear-gradient(-45deg,var(--ink) 0 14px,var(--yellow) 14px 28px);border-bottom:2.5px solid var(--ink)}
.in{padding:24px 26px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px dashed var(--ink);padding-bottom:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:Oswald,sans-serif;font-weight:700;font-size:20px;letter-spacing:.1em}
.lvl{width:46px;height:17px;border:2px solid var(--ink);border-radius:9px;background:var(--yellow);position:relative}.lvl i{position:absolute;left:16px;top:1.5px;width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
.no{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em}
h1{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:clamp(34px,8vw,52px);line-height:.95;margin:20px 0 4px}
h1 em{font-style:normal;color:var(--red)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;margin-top:18px}
.kv dt{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding-top:3px}
.kv dd{font-weight:500}
.works{white-space:pre-line}
.state{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.08em;padding:4px 10px;border:2px solid currentColor}
.ok{color:var(--green)}.exp{color:var(--red)}
.terms{margin-top:20px;font-size:14px;color:var(--ink2);border-left:3px solid var(--yellow);padding-left:12px}
.sign{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:24px;flex-wrap:wrap}
.sign .hand{font-family:Caveat,cursive;font-size:40px;line-height:1;border-bottom:1.5px solid var(--ink);padding:0 18px 2px 4px}
.sign small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--ink2);margin-top:4px}
.stamp{position:absolute;right:26px;top:118px;font-family:Oswald,sans-serif;font-weight:700;font-size:22px;letter-spacing:.1em;color:var(--red);border:4px solid var(--red);padding:3px 12px;transform:rotate(-12deg);opacity:.85;mix-blend-mode:multiply}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:13px 16px;border:2px solid var(--ink);text-decoration:none;cursor:pointer;background:var(--paper)}
.btn.wa{background:#25d366;color:#0b2a16;box-shadow:4px 4px 0 var(--ink)}
.msg{text-align:center;padding:60px 20px;font-family:"IBM Plex Mono",monospace}
@media(max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}.stamp{top:auto;bottom:120px;right:16px}}
@media print{body{background:#fff;padding:0}.t{box-shadow:none}.acts{display:none}}
</style>
</head>
<body>
<main class="t" id="t"><div class="msg">Загружаю талон…</div></main>
<script src="/config.js"></script>
<script src="/garantiya.js"></script>
</body>
</html>
